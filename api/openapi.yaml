openapi: 3.1.0
info:
  description: "API REST para emisión de comprobantes electrónicos ante SUNAT Perú\
    \ (Facturas, Boletas, Notas, Guías de Remisión, Resúmenes)."
  title: API de Facturación Electrónica SUNAT
  version: 1.0.0
servers:
- description: Local
  url: http://localhost:3000
tags:
- description: "Facturas y Boletas (01, 03)"
  name: invoice
- description: "Notas de Crédito/Débito (07, 08)"
  name: note
- description: Guías de Remisión (09 — GRE REST)
  name: despatch
- description: Resumen Diario / Comunicación de Baja
  name: summary
- description: Consulta y gestión de documentos
  name: documents
- description: CRUD de empresas emisoras
  name: company
- description: Estado de las colas BullMQ
  name: queues
- description: Cuentas cliente del SaaS (poseen Companies y ApiKeys) — solo master
  name: tenants
- description: "Signup, login y sesión de usuarios humanos"
  name: auth
- description: Suscripciones a eventos vía webhook
  name: webhooks
- description: Sucursales / establecimientos anexos registrados en SUNAT SOL
  name: branches
- description: Gestión de API keys (solo accesible con MASTER_API_KEY)
  name: api-keys
- description: Audit log de acciones mutantes (solo master)
  name: audit
- description: Endpoints públicos sin auth (consulta de comprobantes por clientes
    finales)
  name: public
- description: Health check / utilidades
  name: system
paths:
  /health:
    get:
      responses:
        "200":
          description: Default Response
      summary: Health check del servicio (DB + Redis + SUNAT env)
      tags:
      - system
      x-accepts:
      - application/json
  /internal/certificates/expiring:
    get:
      parameters:
      - explode: true
        in: query
        name: days
        required: false
        schema:
          default: 30
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          description: Default Response
      summary: List certificates expiring within N days (internal)
      tags:
      - system
      x-accepts:
      - application/json
  /internal/webhooks/stats:
    get:
      parameters:
      - explode: true
        in: query
        name: days
        required: false
        schema:
          default: 7
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
          type: integer
        style: form
      responses:
        "200":
          description: Default Response
      summary: Webhook delivery statistics (internal)
      tags:
      - system
      x-accepts:
      - application/json
  /api/v1/invoice/send:
    post:
      description: "Genera el XML UBL 2.1, lo firma digitalmente y lo encola para\
        \ envío asíncrono a SUNAT. Responde 202 inmediatamente. Para conocer el resultado\
        \ final consultar GET /documents/{id}. Idempotente por (RUC emisor, tipoDoc,\
        \ serie, correlativo): reenviar el mismo comprobante NO lo duplica. Si ya\
        \ fue aceptado devuelve el mismo id y hash sin reenviar nada a SUNAT; si sigue\
        \ en proceso responde 409 (esperá el resultado, no cambies el correlativo).\
        \ Solo un RECHAZADO exige un correlativo nuevo."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_invoice_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar factura (01) o boleta (03) a SUNAT
      tags:
      - invoice
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/invoice/compute:
    post:
      description: "Motor de cálculo: recibe ítems crudos (cantidad, valorUnitario\
        \ sin IGV, afectación, descuento) y un descuento global opcional, y devuelve\
        \ TODOS los importes fiscales calculados (bases, IGV, descuentos, totales,\
        \ monto en letras). No emite ni persiste nada — úsalo para previsualizar o\
        \ para alimentar POST /invoice/send."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_invoice_compute_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_compute_post_200_response"
          description: Default Response
      summary: "Calcular importes (IGV, descuentos, totales) sin emitir"
      tags:
      - invoice
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/invoice/{id}/pdf:
    get:
      parameters:
      - explode: true
        in: query
        name: format
        required: false
        schema:
          default: a4
          enum:
          - a4
          - ticket
          - ticket80
          - ticket58
          type: string
        style: form
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: "Obtener PDF (A4 oficina, ticket 80mm o ticket 58mm POS)"
      tags:
      - invoice
      x-accepts:
      - application/json
  /api/v1/invoice/{id}/xml:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar XML firmado
      tags:
      - invoice
      x-accepts:
      - application/json
  /api/v1/invoice/{id}/cdr:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar CDR (constancia de SUNAT)
      tags:
      - invoice
      x-accepts:
      - application/json
  /api/v1/note/send:
    post:
      description: "Genera XML UBL 2.1, firma y encola. Responde 202. Consultar GET\
        \ /documents/{id} para el resultado final. Idempotente por (RUC emisor, tipoDoc,\
        \ serie, correlativo): reenviar el mismo comprobante NO lo duplica. Si ya\
        \ fue aceptado devuelve el mismo id y hash sin reenviar nada a SUNAT; si sigue\
        \ en proceso responde 409 (esperá el resultado, no cambies el correlativo).\
        \ Solo un RECHAZADO exige un correlativo nuevo."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_note_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_note_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar nota de crédito (07) o débito (08) a SUNAT
      tags:
      - note
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/note/compute:
    post:
      description: "Motor de cálculo para notas: recibe ítems crudos (cantidad, valorUnitario\
        \ sin IGV, afectación, descuento) y un descuento global opcional, y devuelve\
        \ TODOS los importes fiscales calculados. No emite ni persiste nada — úsalo\
        \ para previsualizar o para alimentar POST /note/send (agrega tú el documento\
        \ afectado y el motivo)."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_note_compute_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_compute_post_200_response"
          description: Default Response
      summary: "Calcular importes (IGV, descuentos, totales) sin emitir"
      tags:
      - note
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/note/{id}/pdf:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Obtener PDF de la nota
      tags:
      - note
      x-accepts:
      - application/json
  /api/v1/note/{id}/xml:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar XML firmado
      tags:
      - note
      x-accepts:
      - application/json
  /api/v1/note/{id}/cdr:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar CDR (constancia de SUNAT)
      tags:
      - note
      x-accepts:
      - application/json
  /api/v1/despatch/send:
    post:
      description: "Genera XML UBL 2.1, firma y encola. El worker obtiene token OAuth2,\
        \ envía a SUNAT GRE, guarda ticket y luego hace polling de getStatus. Idempotente\
        \ por (RUC emisor, tipoDoc, serie, correlativo): reenviar el mismo comprobante\
        \ NO lo duplica. Si ya fue aceptado devuelve el mismo id y hash sin reenviar\
        \ nada a SUNAT; si sigue en proceso responde 409 (esperá el resultado, no\
        \ cambies el correlativo). Solo un RECHAZADO exige un correlativo nuevo."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_despatch_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_note_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar guía de remisión (09) via API GRE REST
      tags:
      - despatch
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/despatch/send-multi:
    post:
      description: Recibe datos comunes de transporte + array de destinos. Genera
        una guía por cada destino con correlativo auto-asignado. Cada guía se encola
        independientemente para envío a SUNAT GRE.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_despatch_send_multi_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_despatch_send_multi_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar múltiples guías de remisión por destino
      tags:
      - despatch
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/despatch-transportista/send:
    post:
      description: "Guía emitida por la empresa de transporte (emisor=transportista).\
        \ Incluye remitente (dueño de los bienes) y destinatario. Genera XML UBL 2.1,\
        \ firma y encola para envío a SUNAT GRE."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_despatch_transportista_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_note_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar guía de remisión TRANSPORTISTA (31) via API GRE REST
      tags:
      - despatch
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/despatch/{id}/xml:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar XML firmado de la guía
      tags:
      - despatch
      x-accepts:
      - application/json
  /api/v1/despatch/{id}/pdf:
    get:
      parameters:
      - explode: true
        in: query
        name: format
        required: false
        schema:
          default: a4
          enum:
          - a4
          - ticket
          - ticket80
          - ticket58
          type: string
        style: form
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: "Obtener PDF de la guía (A4 oficina, ticket 80mm o 58mm POS)"
      tags:
      - despatch
      x-accepts:
      - application/json
  /api/v1/despatch/{id}/cdr:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          type: string
        style: simple
      responses:
        "200":
          description: Default Response
      summary: Descargar CDR (constancia de SUNAT)
      tags:
      - despatch
      x-accepts:
      - application/json
  /api/v1/summary/send:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_summary_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_summary_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar resumen diario de boletas (RC)
      tags:
      - summary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/voided/send:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_voided_send_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_summary_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Enviar comunicación de baja (RA)
      tags:
      - summary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/ticket/{ticket}/status:
    get:
      parameters:
      - explode: true
        in: query
        name: ruc
        required: true
        schema:
          maxLength: 11
          minLength: 11
          type: string
        style: form
      - explode: false
        in: path
        name: ticket
        required: true
        schema:
          maxLength: 100
          minLength: 1
          pattern: "^[A-Za-z0-9-]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_ticket__ticket__status_get_200_response"
          description: Default Response
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_ticket__ticket__status_get_202_response"
          description: Default Response
      summary: Consultar estado de ticket asíncrono (SOAP o GRE)
      tags:
      - summary
      x-accepts:
      - application/json
  /api/v1/invoice/cancel:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_invoice_cancel_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_summary_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Anular factura via comunicación de baja
      tags:
      - summary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/boleta/cancel:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v1_boleta_cancel_post_request"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_summary_send_post_202_response"
          description: Default Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_invoice_send_post_400_response"
          description: Default Response
      summary: Anular boleta via resumen diario (estado=3)
      tags:
      - summary
      x-content-type: application/json
      x-accepts:
      - application/json
  /api/v1/documents:
    get:
      parameters:
      - explode: true
        in: query
        name: ruc
        required: false
        schema:
          maxLength: 11
          minLength: 11
          type: string
        style: form
      - explode: true
        in: query
        name: tipoDoc
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: serie
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: estado
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: env
        required: false
        schema:
          enum:
          - live
          - test
          type: string
        style: form
      - explode: true
        in: query
        name: fechaDesde
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: fechaHasta
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: clienteNumDoc
        required: false
        schema:
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          exclusiveMinimum: true
          maximum: 9007199254740991
          minimum: 0
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v1_documents_get_200_response"
          description: Default Response
      summary: Listar documentos con filtros y paginación
      tags:
      - documents
      x-accepts:
      - application/json
  /api/v1/documents/{id}:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          pattern: "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
